apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator-sa
---
# RBAC: Give the Orchestrator permission to manage Pods
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-manager-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator-binding
subjects:
- kind: ServiceAccount
  name: orchestrator-sa
  namespace: default
roleRef:
  kind: Role
  name: pod-manager-role
  apiGroup: rbac.authorization.k8s.io
---
# The Orchestrator Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      serviceAccountName: orchestrator-sa
      containers:
      - name: server
        image: my-orchestrator:local
        imagePullPolicy: Never # Uses local docker image
        env:
        - name: WORKER_IMAGE
          value: "my-worker:local"
        - name: ORCHESTRATOR_URL
          value: "http://orchestrator-service"
        ports:
        - containerPort: 3000
---
# Service to expose the Orchestrator
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-service
spec:
  selector:
    app: orchestrator
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
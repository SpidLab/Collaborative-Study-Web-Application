version: "3.8"

services:
  qc-controller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qc-controller
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DEBUG=false
      - MONGO_USERNAME=CollaboratorDB
      - MONGO_PASSWORD=CollaboratorDB@123
      - MONGO_CLUSTER=collaboratordb.68hkp69.mongodb.net
      - DEFAULT_DATA_FILE=/app/data/data_party_a_small.csv
      - PCA_MODEL_PATH=/app/models
    volumes:
      # Mount the local data directory with 14-sample dataset
      - ./data:/app/data:ro
      # Mount models directory for PCA model persistence
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:5001/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - qc-network

networks:
  qc-network:
    driver: bridge

# Runs on the single EC2 host. Both images are pulled from ECR:
#   api  = Flask backend (gunicorn)
#   web  = Caddy + baked-in React build; serves the site and proxies /api to api,
#          with automatic Let's Encrypt HTTPS. No files to upload to the host.
services:
  api:
    image: ${API_IMAGE}
    restart: always
    environment:
      - MONGO_URI=${MONGO_URI}
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Collaborative Study}
      - APP_BASE_URL=https://${DOMAIN}
      - PORT=5000
    expose:
      - "5000"

  web:
    image: ${WEB_IMAGE}
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data: {}
  caddy_config: {}
